<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>口袋BA 授权工具</title>
    <style>
      :root {
        --bg: #ffffff;
        --bg-subtle: #f9fafb;
        --text: #111827;
        --text-secondary: #6b7280;
        --border: #e5e7eb;
        --accent: #111827;
        --danger: #b91c1c;
        --ok: #047857;
        --radius: 8px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: var(--bg-subtle);
        color: var(--text);
        font-size: 14px;
        line-height: 1.5;
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 28px 24px 36px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      .sub { color: var(--text-secondary); margin: 0 0 20px; font-size: 13px; }
      label { display: block; font-size: 13px; color: var(--text-secondary); margin: 14px 0 6px; }
      input, textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 8px 10px;
        font: inherit;
        background: #fff;
      }
      textarea { min-height: 120px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
      input.mono { font-family: ui-monospace, Consolas, monospace; letter-spacing: 0.03em; }
      .row { display: flex; gap: 8px; }
      .row input, .row textarea { flex: 1; }
      button {
        font: inherit;
        border: 1px solid var(--border);
        background: #fff;
        border-radius: var(--radius);
        padding: 8px 12px;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
        width: 100%;
        margin-top: 16px;
        height: 40px;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .meta { font-size: 12px; color: var(--text-secondary); margin-top: 16px; word-break: break-all; }
      .warn { color: var(--danger); font-size: 12px; margin-top: 8px; }
      .ok { color: var(--ok); font-size: 12px; margin-top: 8px; }
      .msg { margin-top: 10px; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>口袋BA 授权工具</h1>
      <p class="sub">把使用端「本机授权」页上的机器码贴到这里，生成授权码发回对方。</p>

      <label>对方机器码</label>
      <input id="machineId" class="mono" type="text" placeholder="例如 A1B2C3D4-E5F60718-..." />

      <button id="issue" class="primary" type="button">生成授权码</button>
      <p id="issueMsg" class="msg"></p>

      <label>授权码</label>
      <div class="row">
        <textarea id="license" readonly placeholder="生成后显示在这里"></textarea>
        <button id="copyLicense" type="button">复制</button>
      </div>

      <div class="meta">
        公钥指纹：<span id="fp">…</span>
        <div id="match"></div>
        <div>私钥保存在本机用户目录，请自行备份，丢失后无法再为已发出的授权码续签同一套公钥。</div>
      </div>
    </div>
    <script src="./renderer.js"></script>
  </body>
</html>
